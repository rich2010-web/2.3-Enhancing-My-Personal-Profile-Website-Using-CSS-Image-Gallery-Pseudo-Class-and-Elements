<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="Contact_styles.css">

    <title>Contact Me</title>

    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- Init EmailJS -->
    <script type="text/javascript">
        (function(){
            emailjs.init({
                publicKey: "rSgQ-iaRvbYQXHRy2",
            });
        })();
    </script>
</head>

<body>

    <h1>Contact Me</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="About.html">About Me</a> |
        <a href="Hobbies.html">Hobbies</a> |
        <a href="Favorites.html">Favorites</a> |
        <a href="Goals.html">Goals</a> |
        <a href="Contact.html">Contact Me</a>
    </nav>

    <hr>

    <form id="contact-form">

        <!-- Name -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <br><br>

        <!-- Email -->
        <label for="email">Gmail:</label>
        <input type="email" id="email" name="email" placeholder="Enter your Gmail" required>

        <br><br>

        <!-- Gender -->
        <label>Gender:</label>
        <br>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="gay" name="gender" value="Gay">
        <label for="gay">Gay</label>

        <input type="radio" id="lesbian" name="gender" value="Lesbian">
        <label for="lesbian">Lesbian</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Strand -->
        <label for="strand">Strand:</label>
        <select id="strand" name="strand" required>
            <option value="">Select Strand</option>
            <option value="ICT">ICT</option>
            <option value="STEM">STEM</option>
            <option value="ABM">ABM</option>
            <option value="GAS">GAS</option>
            <option value="HUMSS">HUMSS</option>
        </select>

        <br><br>

        <!-- Message -->
        <label for="message">Message:</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="50" placeholder="Type your message here..." required></textarea>

        <br><br>

        <button type="submit">Send Message</button>
        <button type="reset">Clear Form</button>

    </form>

    <script>
        const form = document.getElementById("contact-form");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            // Target the form via selector string for EmailJS v4
            emailjs.sendForm("service_ipbz7ep", "template_1kt3cpx", "#contact-form")
                .then(function(response) {
                    console.log("SUCCESS!", response.status, response.text);
                    alert("Message sent successfully!");
                    form.reset();
                })
                .catch(function(error) {
                    console.error("EMAILJS ERROR:", error);
                    alert("Message failed to send.\n\nPlease check the browser console (F12) for details.");
                });
        });
    </script>

</body>

</html>
